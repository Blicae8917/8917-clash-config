# 将此片段合并到你自己的 Mihomo 配置中。
# PROXY 只是示例策略组名称，请替换成实际存在的策略组。

rule-providers:
  8917-direct:
    type: http
    behavior: classical
    format: text
    path: ./ruleset/8917-direct.list
    url: https://raw.githubusercontent.com/Blicae8917/8917-clash-config/main/rules/direct.list
    interval: 86400

  8917-proxy:
    type: http
    behavior: classical
    format: text
    path: ./ruleset/8917-proxy.list
    url: https://raw.githubusercontent.com/Blicae8917/8917-clash-config/main/rules/proxy.list
    interval: 86400

  8917-grokbot:
    type: http
    behavior: classical
    format: text
    path: ./ruleset/8917-grokbot.list
    url: https://raw.githubusercontent.com/Blicae8917/8917-clash-config/main/rules/grokbot.list
    interval: 86400

  8917-ai:
    type: http
    behavior: classical
    format: text
    path: ./ruleset/8917-ai.list
    url: https://raw.githubusercontent.com/Blicae8917/8917-clash-config/main/rules/ai.list
    interval: 86400

rules:
  - RULE-SET,8917-direct,DIRECT
  - RULE-SET,8917-proxy,PROXY
  - RULE-SET,8917-grokbot,GROKBOT
  - RULE-SET,8917-ai,AI
